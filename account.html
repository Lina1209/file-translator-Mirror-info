<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — Транслятор файлов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8ba888">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mirror-info">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body class="min-h-screen flex flex-col">
    <header class="mk-header">
        <div class="mk-shell mk-header__inner">
            <a href="index.html" class="mk-brand">
                <span class="mk-brand__mark"><i class="fa-solid fa-clone"></i></span>
                <span><span class="mk-brand__name">Транслятор файлов</span><span class="mk-brand__tag">личный кабинет</span></span>
            </a>
            <nav class="mk-nav">
                <a href="index.html" class="mk-nav-link">Главная</a>
                <a href="book.html" class="mk-nav-link">Читалка</a>
                <a href="admin.html" class="mk-nav-link">Админ-панель</a>
            </nav>
            <a href="index.html#translator" class="mk-btn mk-btn--primary mk-btn--sm">Перевести файл</a>
        </div>
    </header>

    <main class="flex-1 py-10">
        <div class="mk-shell">
            <h1 class="mk-section__title">Личный кабинет</h1>
            <div class="grid gap-4 sm:grid-cols-2 mb-8">
                <div class="mk-card p-5">
                    <span class="text-sm font-semibold text-[var(--text-muted)]">Бесплатный лимит</span>
                    <p class="mt-2 text-2xl font-bold"><span id="accTrialLeft">3</span> из 3 файлов</p>
                </div>
                <div class="mk-card p-5">
                    <span class="text-sm font-semibold text-[var(--text-muted)]">Оформлено заявок</span>
                    <p id="accOrdersCount" class="mt-2 text-2xl font-bold">0</p>
                </div>
            </div>

            <div class="mk-card mk-workbench">
                <div class="flex items-center justify-between gap-3 mb-4">
                    <h2 class="text-lg font-bold">История ваших заявок</h2>
                    <button type="button" id="clearHistoryBtn" class="mk-btn mk-btn--ghost mk-btn--sm hidden">Очистить</button>
                </div>
                <div id="ordersList" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <footer class="mk-footer !mt-auto">
                <div class="mk-shell mk-footer__bottom">
            <div>
                <span>©Lina_Winter · «©Mirror - info» · 2026</span>
                <div class="flex flex-wrap items-center gap-3 mt-2" style="font-size:0.8rem;">
                    <a href="https://mirror-info.forum2x2.ru/" target="_blank" rel="noopener">Сайт</a>
                    <a href="https://mirror-info.forum2x2.ru/publi" target="_blank" rel="noopener">Публикации</a>
                    <a href="https://pin.it/4e2vPMAMm" target="_blank" rel="noopener">Pinterest</a>
                    <a href="https://github.com/Lina1209?tab=repositories" target="_blank" rel="noopener">GitHub</a>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-4">
                <a href="book.html">Читалка</a>
                <a href="index.html">На главную</a>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const trialSaved = localStorage.getItem('mirror_translator_free_left');
            document.getElementById('accTrialLeft').textContent = trialSaved === null ? 3 : Math.max(0, parseInt(trialSaved, 10));
            const ordersList = document.getElementById('ordersList');
            const clearBtn = document.getElementById('clearHistoryBtn');

            function render() {
                const orders = JSON.parse(localStorage.getItem('mirror_translator_orders') || '[]');
                document.getElementById('accOrdersCount').textContent = orders.length;
                if (!orders.length) {
                    clearBtn.classList.add('hidden');
                    ordersList.innerHTML = '<p class="text-sm text-[var(--text-muted)]">Заявок пока нет.</p>';
                    return;
                }
                clearBtn.classList.remove('hidden');
                ordersList.innerHTML = [...orders].reverse().map(o => `
                    <div class="p-4 rounded-xl border border-[var(--border-color)] bg-[var(--surface-alt)]">
                        <div class="flex justify-between font-bold text-sm">
                            <span class="text-[var(--primary-color)]">#${o.id}</span>
                            <span class="mk-pill">${o.status || 'Новая'}</span>
                        </div>
                        <p class="mt-1 font-semibold">${o.service} (${o.lang})</p>
                        <p class="text-sm text-[var(--text-muted)]">Объём: ${o.chars} симв. · Оценка: ${o.estimate}</p>
                    </div>
                `).join('');
            }
            clearBtn.addEventListener('click', () => { localStorage.removeItem('mirror_translator_orders'); render(); });
            render();
        });
    </script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
