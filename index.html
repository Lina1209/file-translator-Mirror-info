<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Translator / Mirror Info</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Mirror Info</p>
          <h1>File Translator</h1>
        </div>
        <button id="resetButton" class="ghost-btn" type="button">Сброс</button>
      </header>

      <main class="layout">
        <section class="panel controls-panel">
          <div class="field-group">
            <label for="fileInput">Загрузить файл</label>
            <input id="fileInput" type="file" accept=".txt,.md,.json,.csv,.html,.xml,.js,.css" />
          </div>

          <div class="field-group">
            <label for="sourceText">Текст</label>
            <textarea id="sourceText" placeholder="Введите текст или загрузите файл..." rows="14"></textarea>
          </div>

          <div class="action-row">
            <button id="mirrorBtn" class="primary-btn" type="button">Зеркально</button>
            <button id="upperBtn" type="button">Верхний регистр</button>
            <button id="lowerBtn" type="button">Нижний регистр</button>
            <button id="trimBtn" type="button">Убрать лишние пробелы</button>
          </div>
        </section>

        <aside class="panel info-panel">
          <h2>Информация</h2>

          <div class="stat-grid">
            <div class="stat-card">
              <span class="label">Имя</span>
              <strong id="fileName">—</strong>
            </div>
            <div class="stat-card">
              <span class="label">Тип</span>
              <strong id="mimeType">—</strong>
            </div>
            <div class="stat-card">
              <span class="label">Размер</span>
              <strong id="fileSize">—</strong>
            </div>
            <div class="stat-card">
              <span class="label">Расширение</span>
              <strong id="fileExt">—</strong>
            </div>
            <div class="stat-card">
              <span class="label">Символы</span>
              <strong id="charCount">0</strong>
            </div>
            <div class="stat-card">
              <span class="label">Слова</span>
              <strong id="wordCount">0</strong>
            </div>
          </div>

          <div class="field-group compact">
            <label for="outputText">Результат</label>
            <textarea id="outputText" rows="12" placeholder="Результат появится здесь..."></textarea>
          </div>

          <div class="action-row single-row">
            <button id="downloadBtn" class="primary-btn" type="button">Скачать .txt</button>
          </div>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
