<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirror Info | File Translator</title>
    <meta
      name="description"
      content="Mirror Info File Translator — processing, mirroring, and export of text files."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <span class="brand-mark">MI</span>
          <div>
            <p class="eyebrow">Mirror Info</p>
            <h1>File Translator</h1>
          </div>
        </div>

        <div class="header-actions">
          <button id="copyBtn" class="secondary-btn" type="button">Копировать</button>
          <button id="resetBtn" class="ghost-btn" type="button">Сброс</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel input-panel">
          <div class="panel-head">
            <h2>Исходный текст</h2>
            <label class="upload-field" for="fileInput">
              <span>Загрузить файл</span>
              <input id="fileInput" type="file" accept=".txt,.md,.json,.csv,.html,.xml,.js,.css" />
            </label>
          </div>

          <textarea id="sourceText" placeholder="Введите текст или загрузите файл..." spellcheck="false"></textarea>

          <div class="toolbar">
            <button data-action="mirror" class="primary-btn" type="button">Зеркально</button>
            <button data-action="reverseWords" type="button">Слова наоборот</button>
            <button data-action="upper" type="button">Верхний регистр</button>
            <button data-action="lower" type="button">Нижний регистр</button>
            <button data-action="title" type="button">Title Case</button>
            <button data-action="trim" type="button">Без пробелов</button>
            <button data-action="sort" type="button">Сортировать строки</button>
            <button data-action="unique" type="button">Убрать дубликаты</button>
          </div>
        </section>

        <aside class="panel info-panel">
          <div class="info-head">
            <h2>Информация</h2>
            <span id="statusPill" class="status-pill">Готово</span>
          </div>

          <div class="stats-grid">
            <div class="stat-card">
              <span>Файл</span>
              <strong id="fileName">—</strong>
            </div>
            <div class="stat-card">
              <span>Тип</span>
              <strong id="mimeType">—</strong>
            </div>
            <div class="stat-card">
              <span>Размер</span>
              <strong id="fileSize">—</strong>
            </div>
            <div class="stat-card">
              <span>Расширение</span>
              <strong id="fileExt">—</strong>
            </div>
            <div class="stat-card">
              <span>Символы</span>
              <strong id="charCount">0</strong>
            </div>
            <div class="stat-card">
              <span>Слова</span>
              <strong id="wordCount">0</strong>
            </div>
            <div class="stat-card wide">
              <span>Строки</span>
              <strong id="lineCount">0</strong>
            </div>
          </div>

          <div class="output-box">
            <label for="outputText">Результат</label>
            <textarea id="outputText" placeholder="Результат появится здесь..." spellcheck="false"></textarea>
          </div>

          <div class="footer-actions">
            <button id="downloadBtn" class="primary-btn" type="button">Скачать .txt</button>
          </div>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
